[project]
name = "rag-agent-platform"
version = "0.1.0"
description = "A modular document RAG platform with Naive RAG, Advanced RAG, GraphRAG and Agentic RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "jieba>=0.42.1",
    "langchain-core",
    "langgraph",
    "networkx>=3.0",
    "pydantic-settings",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv",
    "rank-bm25>=0.2.2",
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent_platform"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
