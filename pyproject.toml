[project]
name = "rag-agent-platform"
version = "0.1.0"
description = "A modular document RAG platform with Naive RAG, Advanced RAG, GraphRAG and Agentic RAG."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core",
    "langgraph",
    "networkx>=3.0",
    "pydantic-settings",
    "python-dotenv",
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_agent_platform"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
